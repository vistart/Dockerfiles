name: Docker Image Transfer
on:
  workflow_call:
    inputs:
      source_image:
        required: true
        type: string
        description: "Source image name (e.g. redis or redis/redis-stack)"
      source_tag:
        required: true
        type: string
        description: "Source image tag (e.g. latest, 7.4)"
      dest_image:
        required: false
        type: string
        description: "Destination image name (defaults to source_image if not provided)"
        default: ""
      dest_namespace:
        required: true
        type: string
        default: 'vistart_public'
        description: "Destination namespace in Aliyun registry"
      dest_registries:
        required: false
        type: string
        default: 'registry.cn-shanghai.aliyuncs.com'
        description: "Comma-separated list of destination registries"
    secrets:
      ALIYUN_USERNAME:
        required: true
      ALIYUN_PASSWORD:
        required: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to primary Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Login to secondary Aliyun Container Registry
        if: contains(inputs.dest_registries, 'registry.us-west-1.aliyuncs.com')
        uses: docker/login-action@v3
        with:
          registry: registry.us-west-1.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Transfer Image
        run: |
          OLD_TAG=${{ inputs.source_image }}:${{ inputs.source_tag }}

          # Determine destination image name
          if [ -n "${{ inputs.dest_image }}" ]; then
            DEST_IMAGE=${{ inputs.dest_image }}
          else
            if [[ "${{ inputs.source_image }}" == *"/"* ]]; then
              DEST_IMAGE=$(echo "${{ inputs.source_image }}" | awk -F'/' '{print $NF}')
            else
              DEST_IMAGE=${{ inputs.source_image }}
            fi
          fi

          # Generate tags for all registries
          TAGS=""
          IFS=',' read -ra REGISTRIES <<< "${{ inputs.dest_registries }}"
          for registry in "${REGISTRIES[@]}"; do
            registry=$(echo "$registry" | xargs)
            NEW_TAG="${registry}/${{ inputs.dest_namespace }}/$DEST_IMAGE:${{ inputs.source_tag }}"
            TAGS="$TAGS --tag $NEW_TAG"
            echo "Destination: $NEW_TAG"
          done

          echo "Source: $OLD_TAG"

          if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
              docker buildx create --name mybuilder --use
          fi

          docker buildx imagetools create $TAGS $OLD_TAG || true

          echo "Transfer completed"