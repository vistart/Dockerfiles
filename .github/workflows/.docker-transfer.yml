name: Docker Image Transfer
on:
  workflow_call:
    inputs:
      source_image:
        required: true
        type: string
        description: "Source image name (e.g. redis or redis/redis-stack)"
      source_tag:
        required: true
        type: string
        description: "Source image tag (e.g. latest, 7.4)"
      dest_image:
        required: false
        type: string
        description: "Destination image name (defaults to source_image if not provided)"
        default: ""
      dest_namespace:
        required: true
        type: string
        default: 'vistart_public'
        description: "Destination namespace in Aliyun registry"
    secrets:
      ALIYUN_USERNAME:
        required: true
      ALIYUN_PASSWORD:
        required: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      
      - name: Transfer Image
        run: |
          # Handle source image
          OLD_TAG=${{ inputs.source_image }}:${{ inputs.source_tag }}
          
          # Determine destination image name
          if [ -n "${{ inputs.dest_image }}" ]; then
            # Use provided dest_image if available
            DEST_IMAGE=${{ inputs.dest_image }}
          else
            # Extract base name from source_image if it contains a slash
            if [[ "${{ inputs.source_image }}" == *"/"* ]]; then
              DEST_IMAGE=$(echo "${{ inputs.source_image }}" | awk -F'/' '{print $NF}')
            else
              DEST_IMAGE=${{ inputs.source_image }}
            fi
          fi
          
          NEW_TAG=registry.cn-shanghai.aliyuncs.com/${{ inputs.dest_namespace }}/$DEST_IMAGE:${{ inputs.source_tag }}
          
          echo "Source: $OLD_TAG"
          echo "Destination: $NEW_TAG"
          
          if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
              docker buildx create --name mybuilder --use
          fi
          
          docker buildx imagetools create --tag $NEW_TAG $OLD_TAG || true
          
          echo "Transfer completed"