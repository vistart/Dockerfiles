name: Build and Push Custom Postgres Images

on:
  workflow_call:
    inputs:
      pg_version:
        required: true
        type: string
        description: "PostgreSQL version (e.g., 16, 15, 14)"
      dockerhub_repo:
        required: true
        type: string
        description: "Docker Hub repository (e.g., vistart/postgres)"
      aliyun_registry:
        required: true
        type: string
        description: "Aliyun registry (e.g., registry.cn-shanghai.aliyuncs.com/vistart_public/postgres)"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      ALIYUN_USERNAME:
        required: true
      ALIYUN_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          build-args: PG_MAJOR=${{ inputs.pg_version }}
          tags: |
            ${{ inputs.dockerhub_repo }}:${{ inputs.pg_version }}
            ${{ inputs.aliyun_registry }}:${{ inputs.pg_version }}
          push: true
          cache-from: type=gha,scope=pg-${{ inputs.pg_version }}
          cache-to: type=gha,mode=max,scope=pg-${{ inputs.pg_version }}