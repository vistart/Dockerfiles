name: Build and Push TimescaleDB Postgres Images

on:
  workflow_call:
    inputs:
      pg_version:
        required: true
        type: string
        description: "PostgreSQL version (15, 16, 17 or 18)"
      dockerhub_repo:
        required: true
        type: string
        description: "Docker Hub repository (e.g., vistart/postgres-exts-ts)"
      aliyun_registry:
        required: true
        type: string
        description: "Aliyun registry (e.g., registry.cn-shanghai.aliyuncs.com/vistart_public/postgres-exts-ts)"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      ALIYUN_USERNAME:
        required: true
      ALIYUN_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # amd64 only: the runner is native amd64, so no QEMU emulation is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to Aliyun Container Registry (Shanghai)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./postgres-timescaledb
          file: ./postgres-timescaledb/${{ inputs.pg_version }}/Dockerfile
          platforms: ${{ inputs.platforms }}
          tags: |
            ${{ inputs.dockerhub_repo }}:${{ inputs.pg_version }}
            ${{ inputs.aliyun_registry }}:${{ inputs.pg_version }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=pg-ts-${{ inputs.pg_version }}
          cache-to: type=gha,mode=max,scope=pg-ts-${{ inputs.pg_version }}
