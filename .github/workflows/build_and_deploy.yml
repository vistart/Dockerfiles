name: common-images-transition

on:
    push:
        branches: [ common-images-transition ]
    schedule:
        - cron: '00 21 * * *'

jobs:
    transfer_redis:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Install jq
              run: sudo apt-get update && sudo apt-get install -y jq

            -
                name: Login to Aliyun Container Registry Shanghai
                uses: docker/login-action@v3
                with:
                    registry: registry.cn-shanghai.aliyuncs.com
                    username: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
                    password: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

            - name: Pull and retag multi-architecture image
              run: |
                # Set old and new tags
                OLD_TAG=redis:latest
                NEW_TAG=registry.cn-shanghai.aliyuncs.com/vistart_public/redis:latest

                # Create a new buildx builder instance
                docker buildx create --name mybuilder --use

                # Pull the existing manifest
                docker buildx imagetools inspect $OLD_TAG --raw > manifest.json

                # Extract individual images and retag them
                for digest in $(jq -r '.manifests[].digest' manifest.json); do
                    docker pull $OLD_TAG@$digest
                    docker tag $OLD_TAG@$digest $NEW_TAG
                    docker push $NEW_TAG
                done

                # Create and push new manifest
                docker buildx imagetools create -t $NEW_TAG $(for digest in $(jq -r '.manifests[].digest' manifest.json); do echo $NEW_TAG@$digest; done)
                docker buildx imagetools inspect $NEW_TAG