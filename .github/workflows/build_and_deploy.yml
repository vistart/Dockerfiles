name: vlmcsd - Build and Deploy to Aliyun Container Registry

on:
  push:
    branches: [vlmcsd]
  workflow_dispatch:

jobs:
  build_vlmcsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun Container Registry Shanghai
        uses: docker/login-action@v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
          password: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}
      - name: Build and push
        id: build_and_push_vlmcsd
        uses: docker/build-push-action@v5
        with:
          context: vlmcsd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cn-shanghai.aliyuncs.com/vistart_public/vlmcsd:1113
      - name: Image digest
        run: echo ${{ steps.build_and_push_vlmcsd.outputs.digest }}
