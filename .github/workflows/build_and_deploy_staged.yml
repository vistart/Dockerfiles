name: Staged Transfer Docker Images

on:
  push:
    branches: [common-images-transition]
  schedule:
    - cron: "0 3 15 * *" # 每月15号凌晨3点触发
  workflow_dispatch: # 允许手动触发

jobs:
  # 第一阶段：基础镜像
  stage_1_base_images:
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: alpine
      source_tag: "latest"
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第二阶段：Redis 相关镜像
  stage_2_redis:
    needs: stage_1_base_images # 等待第一阶段完成
    strategy:
      matrix:
        include:
          - source_image: redis
            source_tag: "latest"
            dest_image: ""
          - source_image: redis
            source_tag: "8.10"
            dest_image: ""
          - source_image: redis
            source_tag: "8.8"
            dest_image: ""
          - source_image: redis
            source_tag: "8.6"
            dest_image: ""
          - source_image: redis
            source_tag: "8.4"
            dest_image: ""
          - source_image: redis
            source_tag: "8.2"
            dest_image: ""
          - source_image: redis
            source_tag: "8.0"
            dest_image: ""
          - source_image: redis
            source_tag: "7.4"
            dest_image: ""
          - source_image: redis
            source_tag: "7.2"
            dest_image: ""
          - source_image: redis
            source_tag: "7.0"
            dest_image: ""
          - source_image: redis
            source_tag: "6.2"
            dest_image: ""
          - source_image: redis/redis-stack
            source_tag: "latest"
            dest_image: redis-stack
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第三阶段：MySQL 相关镜像
  stage_3_mysql:
    needs: stage_2_redis # 等待第二阶段完成
    strategy:
      matrix:
        include:
          - source_image: mysql
            source_tag: "latest"
            dest_image: ""
          - source_image: mysql
            source_tag: "9.4"
            dest_image: ""
          - source_image: mysql
            source_tag: "9.2"
            dest_image: ""
          - source_image: mysql
            source_tag: "8.4"
            dest_image: ""
          - source_image: mysql
            source_tag: "8.0"
            dest_image: ""
          - source_image: mysql
            source_tag: "5.7"
            dest_image: ""
          - source_image: mysql
            source_tag: "5.6"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第四阶段：PostgreSQL 相关镜像
  stage_4_postgres:
    needs: stage_3_mysql # 等待第三阶段完成
    strategy:
      matrix:
        include:
          - source_image: postgres
            source_tag: "9"
            dest_image: ""
          - source_image: postgres
            source_tag: "10"
            dest_image: ""
          - source_image: postgres
            source_tag: "11"
            dest_image: ""
          - source_image: postgres
            source_tag: "12"
            dest_image: ""
          - source_image: postgres
            source_tag: "13"
            dest_image: ""
          - source_image: postgres
            source_tag: "14"
            dest_image: ""
          - source_image: postgres
            source_tag: "15"
            dest_image: ""
          - source_image: postgres
            source_tag: "16"
            dest_image: ""
          - source_image: postgres
            source_tag: "17"
            dest_image: ""
          - source_image: postgres
            source_tag: "18"
            dest_image: ""
          - source_image: postgres
            source_tag: "19beta2"
            dest_image: ""
          - source_image: postgres
            source_tag: "latest"
            dest_image: ""
          - source_image: postgres
            source_tag: "15-alpine"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第五阶段：MariaDB 相关镜像
  stage_5_mariadb:
    needs: stage_4_postgres # 等待第四阶段完成
    strategy:
      matrix:
        include:
          - source_image: mariadb
            source_tag: "12.2"
            dest_image: ""
          - source_image: mariadb
            source_tag: "12.1"
            dest_image: ""
          - source_image: mariadb
            source_tag: "12.0"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.0"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.1"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.2"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.3"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.4"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.5"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.6"
            dest_image: ""
          - source_image: mariadb
            source_tag: "10.11"
            dest_image: ""
          - source_image: mariadb
            source_tag: "11.4"
            dest_image: ""
          - source_image: mariadb
            source_tag: "11.7"
            dest_image: ""
          - source_image: mariadb
            source_tag: "11.8"
            dest_image: ""
          - source_image: mariadb
            source_tag: "latest"
            dest_image: ""
          - source_image: mariadb
            source_tag: "lts"
            dest_image: ""
          - source_image: mariadb
            source_tag: "12.3"
            dest_image: ""
          - source_image: mariadb
            source_tag: "13.0-rc"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第六阶段：Firebird 相关镜像
  stage_6_firebird:
    needs: stage_5_mariadb
    strategy:
      matrix:
        include:
          - source_image: firebirdsql/firebird
            source_tag: "3"
            dest_image: firebird
          - source_image: firebirdsql/firebird
            source_tag: "4"
            dest_image: firebird
          - source_image: firebirdsql/firebird
            source_tag: "5"
            dest_image: firebird
          - source_image: firebirdsql/firebird
            source_tag: "6-snapshot"
            dest_image: firebird
          - source_image: firebirdsql/firebird
            source_tag: "latest"
            dest_image: firebird
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第七阶段：Oracle 相关镜像
  stage_7_oracle:
    needs: stage_6_firebird
    strategy:
      matrix:
        include:
          - source_image: gvenzl/oracle-xe
            source_tag: "11-slim"
            dest_image: oracle-xe
          - source_image: gvenzl/oracle-xe
            source_tag: "18-slim"
            dest_image: oracle-xe
          - source_image: gvenzl/oracle-xe
            source_tag: "21-slim"
            dest_image: oracle-xe
          - source_image: gvenzl/oracle-free
            source_tag: "23-slim"
            dest_image: oracle-free
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第八阶段：Clickhouse 相关镜像
  stage_8_clickhouse:
    needs: stage_7_oracle
    strategy:
      matrix:
        include:
          - source_image: clickhouse
            source_tag: "latest"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "lts"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "26.7"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "26.6"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "26.5"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "26.3"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "26.1"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "25.12"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "25.10"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "25.9"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "25.7"
            dest_image: ""
          - source_image: clickhouse
            source_tag: "25.3"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第九阶段：MongoDB 相关镜像
  stage_9_mongo:
    needs: stage_8_clickhouse
    strategy:
      matrix:
        include:
          - source_image: mongo
            source_tag: "latest"
            dest_image: ""
          - source_image: mongo
            source_tag: "7"
            dest_image: ""
          - source_image: mongo
            source_tag: "4.4.18"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  # 第十阶段：PHP 相关镜像
  stage_10_php:
    needs: stage_9_mongo
    strategy:
      matrix:
        include:
          - source_image: php
            source_tag: "8.1"
            dest_image: ""
          - source_image: php
            source_tag: "8.2"
            dest_image: ""
          - source_image: php
            source_tag: "8.3"
            dest_image: ""
          - source_image: php
            source_tag: "8.4"
            dest_image: ""
          - source_image: php
            source_tag: "8.5"
            dest_image: ""
    uses: ./.github/workflows/.docker-transfer.yml
    with:
      source_image: ${{ matrix.source_image }}
      source_tag: ${{ matrix.source_tag }}
      dest_image: ${{ matrix.dest_image }}
      dest_namespace: vistart_public
      dest_registries: "registry.cn-shanghai.aliyuncs.com,registry.us-west-1.aliyuncs.com"
    secrets:
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}
