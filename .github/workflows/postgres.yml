    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_VISTART_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_VISTART_PASSWORD }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_CR_VISTART_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_CR_VISTART_PASSWORD }}

  build-18:
    uses: ./.github/workflows/.postgres-build.yml
    with:
      pg_version: "18"
      platforms: "linux/amd64,linux/arm64,linux/ppc64le"
      dockerhub_repo: "vistart/postgres-exts"
      aliyun_registry: "registry.cn-shanghai.aliyuncs.com/vistart_public/postgres-exts"
